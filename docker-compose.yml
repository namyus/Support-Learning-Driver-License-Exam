name: driving-license-local

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: driving-license-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Copy .env.example to .env and set SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "${DB_HOST_PORT:-14333}:1433"
    volumes:
      - driving_license_sql_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: driving-license-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=DrivingLicense;User Id=sa;Password=${SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

volumes:
  driving_license_sql_data:
